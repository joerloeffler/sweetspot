defaults:
- base
job_name: 7MEM_all_nglyc_sites
protein_inputs:
  A:
    fasta_file: chain_A.fasta
  C:
    fasta_file: chain_C.fasta
sm_inputs:
  B:
    input: glycan.sdf
    input_type: sdf
  D:
    input: glycan.sdf
    input_type: sdf
  E:
    input: glycan.sdf
    input_type: sdf
  F:
    input: glycan.sdf
    input_type: sdf
  G:
    input: glycan.sdf
    input_type: sdf
  H:
    input: glycan.sdf
    input_type: sdf
  I:
    input: glycan.sdf
    input_type: sdf
covale_inputs: A,154,ND2:B,1:CW,null;C,20,ND2:D,1:CW,null;C,21,ND2:E,1:CW,null;C,33,ND2:F,1:CW,null;C,94,ND2:G,1:CW,null;C,278,ND2:H,1:CW,null;C,289,ND2:I,1:CW,null
loader_params:
  MAXCYCLE: 10
metadata:
  glycan: NAG-NAG-MAN
  tree: linear
  sites:
  - site_id: site1
    chain: A
    asn_resid: '154'
    sequon: NGT
    glycan_id: B
  - site_id: site2
    chain: C
    asn_resid: '20'
    sequon: NNS
    glycan_id: D
  - site_id: site3
    chain: C
    asn_resid: '21'
    sequon: NST
    glycan_id: E
  - site_id: site4
    chain: C
    asn_resid: '33'
    sequon: NVT
    glycan_id: F
  - site_id: site5
    chain: C
    asn_resid: '94'
    sequon: NGT
    glycan_id: G
  - site_id: site6
    chain: C
    asn_resid: '278'
    sequon: NTT
    glycan_id: H
  - site_id: site7
    chain: C
    asn_resid: '289'
    sequon: NTS
    glycan_id: I
  rfaa_link_atom_index: 1
  rfaa_link_chirality: CW
  note: RFAA covalent glycan input must use one merged SDF per glycan. The same configured
    SDF is reused for every detected site.
